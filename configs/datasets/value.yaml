feature_sets:
  value_context_feature_set:
    description: Primary value context mode (no same-day transfer response)
    includes:
    - assimilation_source_current
    - assimilation_source_history
    - baseline_state
    - environmental_context
    - baseline_flux_lagged
    - forcing_perturbation_control
    - static
    - temporal_context
  value_memory_augmented_feature_set:
    description: Value memory-augmented mode (includes trajectory memory)
    includes:
    - assimilation_source_current
    - assimilation_source_history
    - baseline_state
    - environmental_context
    - baseline_flux_lagged
    - forcing_perturbation_control
    - trajectory_memory
    - static
    - temporal_context
  value_transfer_informed_feature_set:
    description: Realized-response explanatory mode
    includes:
    - assimilation_source_current
    - assimilation_source_history
    - baseline_state
    - environmental_context
    - baseline_flux_lagged
    - forcing_perturbation_control
    - trajectory_memory
    - realized_transfer_response
    - static
    - temporal_context
